# Builds the ekzegram-bin pacman package from the prebuilt release artifact
# and publishes it to the dedicated 'arch-repo' release as static assets,
# which double as a pacman repository:
#
#   https://github.com/nyakze/ekzegram/releases/download/arch-repo
#
# (Release assets allow up to 2 GB per file; git blocks files over 100 MB,
# so a gh-pages branch is not an option for the 120+ MB package.)
#
# Consumers add the [ekzegram] repo to pacman.conf and then plain
# `pacman -Syu` / `paru` updates ekzegram like any other package.
# See packaging/arch/README.md.

name: arch-repo

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (e.g. v7.4.6-ekzegram1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Build and publish pacman package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed git github-cli
          # The workspace is chowned to the build user for makepkg; gh's own
          # git calls run as root and would refuse it as dubious ownership.
          git config --global --add safe.directory '*'

      - name: Check out sources
        uses: actions/checkout@v4

      - name: Create unprivileged build user
        run: |
          useradd -m builder
          chown -R builder .

      - name: Derive pkgver from release tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          ver="${ver//-/_}"
          echo "Building version ${ver} (tag ${TAG})"
          sed -i "s/^pkgver=.*/pkgver=${ver}/" packaging/arch/PKGBUILD
          # Old releases shipped ekzegram-linux.tar.gz, newer ones .tar.xz.
          if ! curl -sfIL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/ekzegram-linux.tar.xz" -o /dev/null; then
            echo "No .tar.xz asset for ${TAG}; falling back to .tar.gz"
            sed -i "s/^_ext=.*/_ext=gz/" packaging/arch/PKGBUILD
          fi

      - name: Build package
        working-directory: packaging/arch
        # --nodeps: runtime deps are not needed to repack the binary.
        run: runuser -u builder -- makepkg -f --noconfirm --nodeps

      - name: Publish pacman repo to the arch-repo release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pkgfile="$(basename "$(ls packaging/arch/ekzegram-bin-*.pkg.tar.zst)")"
          echo "Publishing ${pkgfile}"

          workdir="$(mktemp -d)"
          cp "packaging/arch/${pkgfile}" "$workdir/"
          pushd "$workdir"
          repo-add ekzegram.db.tar.gz "${pkgfile}"
          # Real files, not the symlinks repo-add leaves behind.
          rm -f ekzegram.db ekzegram.files
          cp ekzegram.db.tar.gz ekzegram.db
          cp ekzegram.files.tar.gz ekzegram.files
          popd

          # The 'arch-repo' release doubles as a static file host for the
          # pacman repo: release assets allow up to 2 GB per file, while git
          # blocks files over 100 MB (so gh-pages is not an option).
          if ! gh release view arch-repo >/dev/null 2>&1; then
            gh release create arch-repo \
              --prerelease \
              --title "Arch pacman repo" \
              --notes "Static pacman repository for ekzegram-bin. Add to pacman.conf: [ekzegram] / SigLevel = Never / Server = https://github.com/${GITHUB_REPOSITORY}/releases/download/arch-repo — updated automatically by the arch-repo workflow on each release. Do not delete."
          fi

          # Drop previous repo assets so only the latest is served.
          gh release view arch-repo --json assets --jq '.assets[].name' \
            | { grep -E '\.(pkg\.tar\.zst|db|db\.tar\.gz|files|files\.tar\.gz)$' || true; } \
            | while read -r asset; do gh release delete-asset arch-repo "$asset" --yes; done

          gh release upload arch-repo --clobber \
            "$workdir/${pkgfile}" \
            "$workdir/ekzegram.db" "$workdir/ekzegram.db.tar.gz" \
            "$workdir/ekzegram.files" "$workdir/ekzegram.files.tar.gz"
